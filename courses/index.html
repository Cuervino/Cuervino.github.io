<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pointage courses</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--muted:#77756f;--line:#e4e2dc;--ok:#1f7a4d;--okbg:#e6f3ec;--ko:#b3261e;--kobg:#fbe9e7;--accent:#0b5cad}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9a988f;--line:#2e2d2a;--ok:#5cc28f;--okbg:#17291f;--ko:#f08a80;--kobg:#2e1a18;--accent:#6aa8ec;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:6px}
.stats b{color:var(--ink)}
.tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:10px 10px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
li:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff}
.qty{flex:none;min-width:34px;text-align:center;font-weight:700;font-size:15px;border-radius:6px;padding:2px 4px}
.qty.multi{background:var(--accent);color:#fff}
.txt{flex:1;min-width:0}
.name{display:block}
.meta{display:block;font-size:12.5px;color:var(--muted)}
.miss{flex:none;font-size:12px;padding:4px 7px}
li.done{background:var(--okbg)}
li.done .box{background:var(--ok);border-color:var(--ok)}
li.done .box::after{content:"✓"}
li.done .name{color:var(--muted);text-decoration:line-through}
li.missing{background:var(--kobg)}
li.missing .box{border-color:var(--ko)}
li.missing .name{color:var(--ko)}
li.missing .miss{border-color:var(--ko);color:var(--ko);background:transparent}
body.todo li.done{display:none}
body.todo section:not(:has(li:not(.done))){display:none}
#missList{margin-top:24px}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Courses Carrefour du 9 octobre 2026</h1>
  <div class="bar"><i id="prog"></i></div>
  <div class="stats">
    <span><b id="nDone">0</b> / <span id="nAll"></span> lignes pointées</span>
    <span><b id="nMiss">0</b> manquante(s)</span>
    <span>Valeur manquante : <b id="vMiss">0,00 €</b></span>
  </div>
  <div class="tools">
    <button id="tTodo">Masquer les pointés</button>
    <button id="tReset">Tout remettre à zéro</button>
  </div>
</header>
<main id="list"></main>
<div id="missList"></div>
<footer>Touche une ligne pour la pointer. "Manque" la marque comme absente, pour la demande de remboursement. Le pointage est gardé dans ce navigateur. Total commande : 345,29 €.</footer>

];

const KEY = "pointage-" + ORDER;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const eur = n => n.toFixed(2).replace(".", ",") + " €";

const items = [];
const list = document.getElementById("list");
DATA.forEach(([cat, rows], ci) => {
  const sec = document.createElement("section");
  sec.innerHTML = `<h2>${cat}</h2><ul></ul>`;
  const ul = sec.querySelector("ul");
  rows.forEach(([name, fmt, q, price], ri) => {
    const id = ci + "-" + ri;
    items.push({id, name, q, price});
    const li = document.createElement("li");
    li.dataset.id = id;
    li.innerHTML = `<span class="box"></span><span class="qty ${q > 1 ? "multi" : ""}">x${q}</span>
      <span class="txt"><span class="name"></span><span class="meta"></span></span>
      <button class="miss">Manque</button>`;
    li.querySelector(".name").textContent = name;
    li.querySelector(".meta").textContent = fmt + ", " + eur(price);
    li.addEventListener("click", e => {
      if (e.target.closest(".miss")) { state[id] = state[id] === "m" ? undefined : "m"; }
      else { state[id] = state[id] === "d" ? undefined : "d"; }
      if (!state[id]) delete state[id];
      save(); render();
    });
    ul.appendChild(li);
  });
  list.appendChild(sec);
});

function render() {
  let done = 0, miss = 0, vmiss = 0;
  const missed = [];
  document.querySelectorAll("li[data-id]").forEach(li => {
    const s = state[li.dataset.id];
    li.classList.toggle("done", s === "d");
    li.classList.toggle("missing", s === "m");
  });
  items.forEach(it => {
    if (state[it.id] === "d") done++;
    if (state[it.id] === "m") { miss++; vmiss += it.price; missed.push(it); }
  });
  document.getElementById("nAll").textContent = items.length;
  document.getElementById("nDone").textContent = done;
  document.getElementById("nMiss").textContent = miss;
  document.getElementById("vMiss").textContent = eur(vmiss);
  document.getElementById("prog").style.width = ((done + miss) / items.length * 100) + "%";
  const ml = document.getElementById("missList");
  ml.innerHTML = missed.length ? "<h2>Manquants</h2><ul></ul>" : "";
  missed.forEach(it => {
    const li = document.createElement("li");
    li.style.cursor = "default";
    li.textContent = `x${it.q} ${it.name} (${eur(it.price)})`;
    ml.querySelector("ul").appendChild(li);
  });
}

const tTodo = document.getElementById("tTodo");
tTodo.onclick = () => { tTodo.classList.toggle("on", document.body.classList.toggle("todo")); };
const tReset = document.getElementById("tReset");
tReset.onclick = () => {
  if (tReset.dataset.armed) { state = {}; save(); render(); delete tReset.dataset.armed; tReset.textContent = "Tout remettre à zéro"; }
  else { tReset.dataset.armed = 1; tReset.textContent = "Confirmer la remise à zéro ?"; setTimeout(() => { delete tReset.dataset.armed; tReset.textContent = "Tout remettre à zéro"; }, 3000); }
};
render();
</script>
